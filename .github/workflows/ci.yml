name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".agents/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".agents/**"
      - "LICENSE"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # The suite runs against the real Supabase-Mumbai DB from US-based runners
    # (~250ms per round trip), so its ~7-minute local runtime stretches to
    # ~15-20+ minutes here. At 15 the job was killed on EVERY run and CI
    # validated nothing; 25 gives real headroom.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      # Integration tests (test_ingest.py, test_api.py) run against the real
      # dev database, not an ephemeral one - they were deliberately built
      # that way (rollback-transaction fixtures, read-only assertions
      # against real crawled data) and assume that data already exists.
      # Same DATABASE_URL secret the crawl workflow uses.
      - name: Test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: npx tsc --noEmit

      # Placeholders are sufficient: the dynamic routes never fetch at build
      # time, and /pricing renders from its canonical fallback if the API is
      # unreachable while Next.js statically prerenders it.
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: pnpm build

name: Weekly Pro Report

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  weekly_report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify programmes registry
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          # Safe to retry: programme verification only closes editions whose
          # non-null closes_at is already in the past; it never promotes rows
          # to open and otherwise only prints the needs-review report.
          for attempt in 1 2 3; do
            uv run python -m scripts.verify_programmes \
              --apply \
              --limit 200 \
              --max-seconds 60 && exit 0
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "attempt $attempt failed; retrying in ${delay}s" >&2
              sleep "$delay"
            fi
          done
          exit 1

      - name: Send weekly Pro reports
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          # Safe to retry: weekly reports are idempotent per recipient because
          # pipeline/weekly_report.py checks _already_sent_this_week(...) before
          # sending and records successful weekly_report deliveries.
          for attempt in 1 2 3; do
            uv run python -m scripts.notification_worker --weekly && exit 0
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "attempt $attempt failed; retrying in ${delay}s" >&2
              sleep "$delay"
            fi
          done
          exit 1

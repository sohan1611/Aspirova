name: Hackathon Digest

# Split out of notifications-digest.yml on 2026-08-30.
#
# It used to be a step in that same workflow, immediately after the daily
# digest, so the two emails left about 60 seconds apart - measured 06:47:24 and
# 06:48:29 UTC. Two emails from one sender arriving together reads as a burst,
# is what recipients unsubscribe from, and is what Gmail bundles.
#
# Slots sit on ODD minutes and well after the daily digest's. The odd minutes
# are GitHub's own documented mitigation - "schedule your workflow to run at a
# different time of the hour" - which had never been applied in this repo; every
# cron here sat on :00 or :30, the exact minutes their docs call out as worst.
#
# GitHub's docs also say a queued scheduled run "may be DROPPED" under load, and
# on Aug 30 all four of the daily digest's entries were skipped outright. A paid
# Render cron job is drafted in PR #105 as the fallback if 14 days under this
# corrected configuration (to ~2026-09-13) still are not reliable enough.
#
# Multiple entries are safe: every recipient is gated on _already_sent_today(),
# so whichever firing happens first does the work and the rest are no-ops.
#
# Scheduling is only half of the spacing guarantee anyway. A delayed daily run
# can still land on top of an on-time hackathon run, so the gap is ENFORCED in
# code: send_hackathon_digests() skips any user who received the daily digest
# within HACKATHON_DIGEST_MIN_GAP (2h). A skipped user is not dropped - a later
# slot sends to them, still bounded by the once-per-calendar-day cap.
on:
  schedule:
    - cron: "19 9 * * *" # 14:49 IST
    - cron: "37 11 * * *" # 17:07 IST
    - cron: "7 13 * * *" # 18:37 IST
  workflow_dispatch: {}

concurrency:
  group: notifications-hackathon
  cancel-in-progress: false

jobs:
  hackathon-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Send hackathon digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: |
          # Retrying is safe: send_hackathon_digests() gates each user on
          # _already_sent_today(..., "hackathon_digest", ...), so a retry after a
          # partial failure resumes rather than re-sending.
          for attempt in 1 2 3; do
            uv run python -m scripts.notification_worker --hackathon-digest && exit 0
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "attempt $attempt failed; retrying in ${delay}s" >&2
              sleep "$delay"
            fi
          done
          exit 1

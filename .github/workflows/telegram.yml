name: Telegram

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the post without sending"
        required: false
        default: true
        type: boolean

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name == 'workflow_dispatch' || vars.TELEGRAM_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Post to Telegram
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          PYTHONUNBUFFERED: "1"
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$DRY_RUN" == "false" ]]; then
            uv run python -m scripts.post_telegram --apply
          else
            uv run python -m scripts.post_telegram --dry-run
          fi

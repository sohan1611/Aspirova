name: Crawl Tier 1

# Tier 1 = every 1-2h (Doc 04 sec 2). Starting at 2h; tighten once real
# volume/cost data justifies it (Doc 02 sec 5 - scale by measured trigger).
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: crawl-tier1
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Generous margin: this network path (GH Actions -> Supabase pooler) has
    # shown meaningfully higher and more variable latency than a local
    # connection - confirmed by direct measurement, not assumed. 12
    # companies each individually bounded by core/db.py's connect/keepalive/
    # statement timeouts should never need this long, but the margin costs
    # nothing on a 2h schedule and avoids a slow-but-real run being killed.
    # SmartRecruiters currently adds ~18 min/crawl because its adapter fetches
    # per-posting detail endpoints every crawl; the board fingerprint is computed
    # after fetch(). This intentionally generous margin can drop back down after
    # the tracked lazy/only-changed detail-fetch follow-up lands.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Tier-1 crawl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Python block-buffers stdout when it's not a TTY (i.e. always, in
          # CI) - confirmed live: every print() across all 12 companies
          # appeared in one burst near the end of an 18-minute run instead
          # of incrementally, making it look like a multi-minute silent hang
          # when the real-time picture was just hidden, not absent.
          PYTHONUNBUFFERED: "1"
        run: uv run python -m crawlers.runner --tier 1

      - name: Recompute hidden opportunities
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: uv run python -m scripts.compute_hidden

      # Post-ingest instant dream-company alerts (Doc handoffs/
      # PHASE-2-HANDOFF.md sec 5) - a separate step in the SAME run rather
      # than code wired into crawlers/runner.py itself: it works off a
      # lookback window on opportunities.first_seen_at (pipeline/
      # notifications.py), not opportunity IDs threaded through the
      # crawl's return value, so it stays correct even if this step is
      # ever rerun independently or the crawl step's job is retried.
      - name: Send instant dream-company alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: uv run python -m scripts.notification_worker --instant-alerts

name: Crawl Tier 1

# Tier 1 crawl runs once daily at 01:00 UTC. Recent 2x/day runs exhausted the
# 3,000 min/mo included Actions budget by hitting their 40-minute timeout every
# run. After batching last_seen_at into one bulk UPDATE per company (per-board
# ingest dropped ~5-7x, e.g. databricks 788 listings 229s -> ~31s), the ATS
# crawl completes in ~24-26 min - dominated by the amazon board's volume - so
# the caps are a 38-minute job cap and a 28-minute ATS-step cap (still far
# leaner than the old failing 40min x 2/day: one completing run beats two
# cancelled ones).
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch: {}

concurrency:
  group: crawl-tier1
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # ATS must complete (it's fast now that last_seen_at is batched); the
    # aggregator runs afterward as best-effort work with its own tight per-step
    # cap below. The job cap bounds worst-case billed minutes per run.
    timeout-minutes: 38
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ATS crawl (tier 1)
        timeout-minutes: 28
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Python block-buffers stdout when it's not a TTY (i.e. always, in
          # CI) - confirmed live: every print() across all 12 companies
          # appeared in one burst near the end of an 18-minute run instead
          # of incrementally, making it look like a multi-minute silent hang
          # when the real-time picture was just hidden, not absent.
          PYTHONUNBUFFERED: "1"
        run: uv run python -m crawlers.runner --tier 1 --group ats

      - name: Run RemoteOK aggregator (tier 1, best-effort)
        continue-on-error: true
        # Hard cap the aggregator: it's the biggest minute-consumer and lowest-
        # value tier (many no-name companies). Never let it burn the budget.
        timeout-minutes: 12
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: uv run python -m crawlers.runner --tier 1 --group aggregator

      - name: Retire listings gone from their boards
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: uv run python -m scripts.expire_missing

      - name: Recompute hidden opportunities
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: uv run python -m scripts.compute_hidden

      - name: Prune expired competitions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: uv run python -m scripts.cleanup_expired_competitions

      # Post-ingest instant dream-company alerts (Doc handoffs/
      # PHASE-2-HANDOFF.md sec 5) - a separate step in the SAME run rather
      # than code wired into crawlers/runner.py itself: it works off a
      # lookback window on opportunities.first_seen_at (pipeline/
      # notifications.py), not opportunity IDs threaded through the
      # crawl's return value, so it stays correct even if this step is
      # ever rerun independently or the crawl step's job is retried.
      - name: Send instant dream-company alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: uv run python -m scripts.notification_worker --instant-alerts

name: Crawl Tier 1

# Tier 1 crawl runs once daily at 01:00 UTC. This repo is public now, so the
# old private-repo Actions included-minutes budget is no longer a constraint for
# standard GitHub-hosted runners. These caps are deliberately loose hang guards,
# not cost-rationing knobs: a real hang (one July run had a silent 24-minute
# stall, suspected pooler-slot queueing) would otherwise occupy the crawl-tier1
# concurrency group indefinitely and block the next scheduled run.
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch: {}

concurrency:
  group: crawl-tier1
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Job cap is a final hang guard, not a billed-minute budget. Keep it >= the
    # sum of explicit step timeouts plus setup/tail margin; current arithmetic:
    # ATS 150 + aggregators 150 + stale-liveness 60 + 5 minutes margin = 365.
    # Otherwise adding a future step can silently reintroduce job-level kills.
    timeout-minutes: 365
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ATS crawl (tier 1)
        # Hard cap only catches hangs. The runner's 7200s soft ATS budget should
        # stop cleanly first, preserving committed work and printing TRUNCATED.
        timeout-minutes: 150
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          # Python block-buffers stdout when it's not a TTY (i.e. always, in
          # CI) - confirmed live: every print() across all 12 companies
          # appeared in one burst near the end of an 18-minute run instead
          # of incrementally, making it look like a multi-minute silent hang
          # when the real-time picture was just hidden, not absent.
          PYTHONUNBUFFERED: "1"
        run: uv run python -m crawlers.runner --tier 1 --group ats

      - name: Run RemoteOK aggregator (tier 1, best-effort)
        continue-on-error: true
        # Keep best-effort semantics for transient source/network failures, but
        # make the cap a hang guard only. The runner's shared 7200s aggregator
        # soft budget should stop cleanly first and print TRUNCATED instead of
        # letting a partial crawl look identical to a complete one.
        timeout-minutes: 150
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: uv run python -m crawlers.runner --tier 1 --group aggregator

      # success() || failure() - NOT always(): these must still run when the
      # ATS step overruns its cap (run 29800767109 was SIGKILL'd there, which
      # silently skipped all three, so dead listings stayed live in the feed
      # and hidden/expired flags went stale). always() would also fire them on
      # a cancelled run, and this workflow uses cancel-in-progress.
      - name: Retire listings gone from their boards
        if: success() || failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: uv run python -m scripts.expire_missing

      - name: Recompute hidden opportunities
        if: success() || failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: uv run python -m scripts.compute_hidden

      - name: Prune expired competitions
        if: success() || failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: uv run python -m scripts.cleanup_expired_competitions

      - name: Check stale undated listing liveness
        if: success() || failure()
        # This tail check can be slow when many undated boards need probing; the
        # cap exists only to catch a hang, not to ration now-free public-repo
        # runner minutes.
        timeout-minutes: 60
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: uv run python -m scripts.check_listing_liveness --apply

      # Post-ingest instant dream-company alerts (Doc handoffs/
      # PHASE-2-HANDOFF.md sec 5) - a separate step in the SAME run rather
      # than code wired into crawlers/runner.py itself: it works off a
      # lookback window on opportunities.first_seen_at (pipeline/
      # notifications.py), not opportunity IDs threaded through the
      # crawl's return value, so it stays correct even if this step is
      # ever rerun independently or the crawl step's job is retried.
      - name: Send instant dream-company alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: uv run python -m scripts.notification_worker --instant-alerts

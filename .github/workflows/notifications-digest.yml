name: Daily Digest

# BACKUP LAYER as of 2026-08-30. The primary is the `aspirova-daily-digest`
# Render cron job (render.yaml, 03:30 UTC), because GitHub does not promise to
# run a scheduled workflow at all. From GitHub's own documentation:
#
#   "The schedule event can be delayed during periods of high loads of GitHub
#    Actions workflow runs. High load times include the start of every hour...
#    If the load is sufficiently high enough, some queued jobs may be DROPPED."
#
# Measured here: +42 min (Aug 24), +36 min (Aug 25), +10h54m (Aug 27), never
# fired (Aug 28), +7h (Aug 29), and on Aug 30 all FOUR entries were skipped.
# Four slots missing together means the failures are correlated - one queue, one
# repo tier - so extra entries do not help the way independent retries would.
#
# This workflow is kept anyway because it is free and cannot do harm: every
# recipient is gated on _already_sent_today() against the UTC calendar day, so
# whichever scheduler fires first does the work and the rest are no-ops. Nobody
# can receive two.
#
# The slots deliberately sit on ODD minutes and AFTER the Render job. GitHub's
# one documented mitigation is "schedule your workflow to run at a different
# time of the hour", and these previously sat on :30/:30/:00/:00 - the exact
# minutes their docs call out as worst. Firing after the primary means the
# normal path is Render sending and these no-opping.
on:
  schedule:
    - cron: "47 4 * * *" # 10:17 IST
    - cron: "13 6 * * *" # 11:43 IST
    - cron: "41 8 * * *" # 14:11 IST
    - cron: "23 10 * * *" # 15:53 IST
  workflow_dispatch: {}

concurrency:
  group: notifications-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Send daily digests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: |
          # Safe to retry: daily digests are idempotent per recipient because
          # pipeline/notifications.py checks _already_sent_today(...) before
          # sending and records sent digests. A rolling cap used to live here
          # and ratcheted a day later each time; see that function's docstring.
          for attempt in 1 2 3; do
            uv run python -m scripts.notification_worker --digest && exit 0
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "attempt $attempt failed; retrying in ${delay}s" >&2
              sleep "$delay"
            fi
          done
          exit 1

      - name: Send closing-soon deadline alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: uv run python -m scripts.notification_worker --closing-soon

      - name: Send saved-search alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: uv run python -m scripts.notification_worker --saved-search-alerts

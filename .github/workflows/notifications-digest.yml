name: Daily Digest

# Once daily (Doc 02 sec 3.6: "one daily digest email per free user, not
# per-opportunity") - off-peak, clear of the Tier-1 crawl's :00/:02h cron
# and the nightly backup's 19:17 UTC slot.
#
# FOUR cron entries for ONE daily email. GitHub's scheduled events are
# best-effort and degrade badly under load - measured on this repo:
#   Aug 24  +42 min      Aug 27  +10h 54m
#   Aug 25  +36 min      Aug 28  never fired at all
# A single entry makes a user-facing email a single point of failure on
# somebody else's queue. Every step in this job is idempotent - the digests
# check _already_sent_recently() against a 20h cap, closing-soon dedupes per
# opportunity, and saved-search advances a last_alerted_at watermark - so the
# first firing that actually happens does the work and the rest are no-ops.
# Nobody can receive a second email from the extra entries.
#
# Spread across the morning (03:30 UTC = 09:00 IST) so even a multi-hour delay
# still lands before midday for the India-based audience.
on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 4 * * *"
    - cron: "0 6 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch: {}

concurrency:
  group: notifications-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Send daily digests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: |
          # Safe to retry: daily digests are idempotent per recipient because
          # pipeline/notifications.py checks _already_sent_recently(...) with
          # DIGEST_FREQUENCY_CAP before sending and records sent digests.
          for attempt in 1 2 3; do
            uv run python -m scripts.notification_worker --digest && exit 0
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "attempt $attempt failed; retrying in ${delay}s" >&2
              sleep "$delay"
            fi
          done
          exit 1

      - name: Send hackathon digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: |
          # Same retry shape and the same idempotency guarantee as the daily
          # digest above: send_hackathon_digests() checks
          # _already_sent_recently(..., "hackathon_digest", ...) against
          # DIGEST_FREQUENCY_CAP, so a retry cannot double-send.
          for attempt in 1 2 3; do
            uv run python -m scripts.notification_worker --hackathon-digest && exit 0
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "attempt $attempt failed; retrying in ${delay}s" >&2
              sleep "$delay"
            fi
          done
          exit 1

      - name: Send closing-soon deadline alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: uv run python -m scripts.notification_worker --closing-soon

      - name: Send saved-search alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: uv run python -m scripts.notification_worker --saved-search-alerts

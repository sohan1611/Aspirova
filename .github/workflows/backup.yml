name: Nightly Backup

# Independent nightly pg_dump -> S3-compatible object storage (Doc 03 sec
# 8/9: "never rely solely on the provider"). Off-peak and offset from the
# Tier-1 crawl's :00/:02h cron so it never competes for the free Supabase
# pooler's connection slots.
on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch: {}

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned to postgresql-client-17 via the official PGDG apt repo,
      # matching the real production Supabase server version (17.6,
      # confirmed live in the 2026-07-05 real-backup drill - see
      # handoffs/PART-2.2-RESTORE-DRILL.md addendum). This was previously
      # pinned to 16 based on an untested assumption; that pin would have
      # made every real nightly run fail outright, since pg_dump refuses to
      # dump from a server *newer* than its own major version ("aborting
      # because of server version mismatch"). pg_dump can only dump
      # *older* servers than itself, never newer ones - so the client must
      # track the server version, not stay conservatively behind it.
      #
      # ubuntu-latest ships a pg_dump 16 binary already on PATH (baked into
      # the runner image, not installed by this workflow) - installing
      # postgresql-client-17 via apt does NOT override it, since PGDG
      # version-suffixed packages install to /usr/lib/postgresql/<ver>/bin/,
      # never to /usr/bin/ directly. Confirmed live: the first real
      # workflow_dispatch run after this pin still resolved `pg_dump` to
      # 16.14 despite postgresql-client-17 installing cleanly. Prepending
      # the versioned bin dir to $GITHUB_PATH makes it win for every later
      # step in this job, including the actual backup script.
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Verify pg_dump resolves to 17
        run: |
          which pg_dump
          pg_dump --version

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run nightly backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_S3_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT_URL }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: uv run python -m scripts.backup_db

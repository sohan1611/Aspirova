[project]
name = "aspirova-production-smoke"
version = "0.1.0"
description = "Anonymous, read-only production browser checks"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49,<2",
    "pytest>=8.3,<9",
]

[dependency-groups]
dev = ["black>=24.10", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
target-version = ["py312"]

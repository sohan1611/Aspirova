# Render Blueprint for the Aspirova FastAPI backend.
#
# Region: Singapore - Render has no Mumbai/India region; Singapore is the
# closest to the Supabase project (aws-1-ap-south-1) at ~100-150ms
# (Topology & Deploy ADR, docs/handoffs/TOPOLOGY-AND-DEPLOY-DECISION.md).
# This deploy is a deliberate, reversible MEASUREMENT of real production
# read-path p95 over that hop - not a "Phase 1 shipped" milestone.
#
# Plan: starter (paid, ~$7/mo), not free - the free tier spins down after
# 15min idle with a ~1min cold start, which makes a live demo worse than
# none.
#
# Secrets (DATABASE_URL, SUPABASE_*) are marked sync: false - set them in
# the Render dashboard only, never commit them here (Doc 08: no secrets in
# code/config files).

services:
  - type: web
    name: aspirova-api
    runtime: python
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen
    # Prevent frontend/docs-only merges from triggering a ~1 GB dependency re-download.
    buildFilter:
      paths:
        - backend/**
        - render.yaml
      ignoredPaths:
        - backend/tests/**
    startCommand: uv run uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # --------------------------------------------------------------- digests
  #
  # These moved off GitHub Actions on 2026-08-30 because GitHub does not
  # promise to run a scheduled workflow at all. Their own docs:
  #
  #   "The schedule event can be delayed during periods of high loads...
  #    If the load is sufficiently high enough, some queued jobs may be
  #    DROPPED."
  #
  # Measured here, not assumed: the digest fired ~35 min late through Aug 26,
  # then 11h late (Aug 27), 12h late (Aug 28), 7h late (Aug 29), and on Aug 30
  # never fired at all - all FOUR cron entries skipped. Four slots missing
  # together means the failures are correlated (one queue, one repo tier), so
  # adding more entries buys nothing. Free-tier public repos sit lowest in that
  # queue and priority cannot be bought.
  #
  # The GitHub workflows are deliberately KEPT as a free backup layer. Running
  # both schedulers cannot double-send: every recipient is gated on
  # _already_sent_today() (UTC calendar day), so whichever fires first does the
  # work and the rest are no-ops.
  #
  # Cost: billed per second of running time with a $1/month minimum per cron
  # service. A ~2-minute daily job is about a penny of runtime, so the floor is
  # effectively the whole price - $1/month each.
  #
  # Secrets are sync: false and set in the dashboard. DATABASE_URL in
  # particular must be IDENTICAL to the web service's: core/unsubscribe.py
  # derives the List-Unsubscribe signing key from it, the worker signs tokens
  # and the API verifies them. If they differ, every unsubscribe link fails
  # verification silently - a failed verify is indistinguishable from a forged
  # token.

  - type: cron
    name: aspirova-daily-digest
    runtime: python
    region: singapore
    plan: starter
    rootDir: backend
    # 03:30 UTC = 09:00 IST.
    schedule: "30 3 * * *"
    buildCommand: pip install uv && uv sync --frozen
    buildFilter:
      paths:
        - backend/**
        - render.yaml
      ignoredPaths:
        - backend/tests/**
    startCommand: uv run python -m scripts.notification_worker --digest
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

  - type: cron
    name: aspirova-hackathon-digest
    runtime: python
    region: singapore
    plan: starter
    rootDir: backend
    # 06:30 UTC = 12:00 IST - three hours after the daily digest, comfortably
    # past HACKATHON_DIGEST_MIN_GAP (2h). That gap is ALSO enforced per user in
    # send_hackathon_digests(), because a schedule alone cannot guarantee it if
    # either run is delayed.
    schedule: "30 6 * * *"
    buildCommand: pip install uv && uv sync --frozen
    buildFilter:
      paths:
        - backend/**
        - render.yaml
      ignoredPaths:
        - backend/tests/**
    startCommand: uv run python -m scripts.notification_worker --hackathon-digest
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
